name: Deploy

on:
  # Site content changes publish from main.
  push:
    branches: [main]
  # Fired by RoNModManager's release.yml after every asset upload completes.
  repository_dispatch:
    types: [app-release]
  # Safety net: self-heals if a dispatch is dropped or the token is unusable.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v6
      - run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # v5 uses upload-artifact v7, which deploy-pages v5 cannot discover.
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
