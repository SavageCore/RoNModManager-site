pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: npm run lint
    - name: check
      run: npm run check
    - name: unit tests
      run: npm run test:unit

pre-push:
  jobs:
    - name: build
      run: npm run build
    - name: check links
      run: npm run check:links
    - name: e2e tests
      run: npm run test:e2e
